[package]
name = "netattrib"
version = "0.1.0"
edition = "2021"
# eframe/egui 0.37 (the GUI) require Rust 1.95.
rust-version = "1.95"
description = "Per-executable network connection attribution for Windows (ETW + IP Helper hybrid)"
license = "MIT"

[[bin]]
name = "netattrib"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# GUI: OpenGL (glow) renderer instead of the default wgpu keeps the binary and build small.
# `persistence`: window geometry and settings survive restarts (see gui/settings.rs).
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.37", default-features = false }
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Measured: abort makes the exe 20 % smaller (5.98 vs 7.45 MB). The panic hook still runs
# before the abort and stops the ETW session, and the writer flushes after every batch.
# (Under unwind a worker panic left the app running with ETW already stopped by the hook.)
# lto = "thin" was 6 % larger; it only shortens builds.
panic = "abort"

[build-dependencies]
# Icon, version information and manifest (build.rs). Without the `toml` feature it reads
# nothing from Cargo.toml beyond the package name and version cargo passes in.
winresource = { version = "0.1.34", default-features = false }
